[build]
	command = "npm run build"
	publish = "dist"

# [functions] block removed 2026-09-16 with netlify/functions/create-checkout.ts.
# Netlify's default functions directory is netlify/functions and esbuild is the
# current default bundler, so remaining functions need no configuration here.
# Re-add an explicit block only if a non-default bundler is required.

# Order confirmation SPA route
[[redirects]]
	from = "/order-confirmation"
	to = "/index.html"
	status = 200

# Soundtrack page removed — redirect old URL to home
[[redirects]]
	from = "/soundtrack/"
	to = "/"
	status = 301

[[redirects]]
	from = "/soundtrack"
	to = "/"
	status = 301

# SPA fallback
[[redirects]]
	from = "/*"
	to = "/index.html"
	status = 200

[[headers]]
  for = "/feed.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
	for = "/*"
	[headers.values]
		X-Frame-Options = "DENY"
		X-Content-Type-Options = "nosniff"
		Referrer-Policy = "strict-origin-when-cross-origin"
		Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
